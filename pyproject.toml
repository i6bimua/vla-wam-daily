[project]
name = "vla-wam-daily"
version = "0.1.0"
description = "Daily VLA and World Action Model research portal"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "feedparser>=6.0.12,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "selectolax>=0.4.11,<0.5",
  "tenacity>=9.1,<10",
  "typer>=0.17,<1",
]

[project.scripts]
vla-wam-daily = "vla_wam_daily.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vla_wam_daily"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vla_wam_daily"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vla_wam_daily"]
ignore_missing_imports = true
mypy_path = ["src"]
