arxiv:
  categories:
    - cs.RO
    - cs.CV
    - cs.AI
    - cs.LG
    - cs.CL
  lookback_days: 3
  max_results_per_category: 2000
  request_delay_seconds: 3.0
  timeout_seconds: 60.0
  retries: 5
  retry_wait_seconds: 5.0
  use_oai_for_recent: true

prefilter:
  exact_phrases:
    - vision-language-action
    - vision language action
    - world action model
    - world-action model
    - latent action model
    - video action model
    - action-conditioned world model
    - generalist robot policy
    - robot foundation model
    - multimodal robot policy
    - speculative decoding
    - speculative sampling
    - assisted decoding
    - assisted generation
    - self-speculative decoding
    - lookahead decoding
    - model quantization
    - neural network quantization
    - LLM quantization
    - VLM quantization
    - integer quantization
    - integer-only quantization
    - post-training quantization
    - quantization-aware training
    - weight-only quantization
    - activation quantization
    - low-bit quantization
  composite_rules:
    - name: vision_language_robotics
      groups:
        - [vision-language, vision language, VLM, multimodal]
        - [robot, policy, action, manipulation]
    - name: world_video_robotics
      groups:
        - [world model, video model, world modeling]
        - [robot, action, manipulation, control]
    - name: generalist_robot_policy
      groups:
        - [generalist, foundation]
        - [robot policy, robotic policy]
    - name: speculative_generation
      groups:
        - [speculative]
        - [decoding, sampling, generation, inference]
    - name: draft_verification_decoding
      groups:
        - [draft model, drafter, verifier]
        - [decoding, generation, language model]
    - name: model_quantization
      groups:
        - [quantization, quantized, INT4, INT8, low-bit, low bit]
        - [model, neural network, transformer, language model, LLM, VLM, weights, activations, inference]

analysis:
  threshold: 6
  max_candidates: 100
  max_concurrency: 3
  max_failure_ratio: 0.30
  prompt_version: "2"
  max_output_tokens: 1800
  model_profiles:
    quality: deepseek-v4-pro
    economy: deepseek-v4-flash
